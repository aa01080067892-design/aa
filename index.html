<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾页 · 资料库（原型 v3）</title>
<!--
  ============================================================
  拾页 Shiye — 资料整理与检索 · 交互原型 v3
  ============================================================
  设计基线：移动优先（320 起）→ 768 平板 → 1024 桌面
  Tokens
    色彩  ink #16181D / ink-2 #3F434C / ink-3 #6B707B（均为 AA 以上）
          accent #3F4EA8 · 用途四色 arg/data/counter/idea
          line #E6E6E2 · bg #FBFBF9 · surface #FFF
    字体  12 / 13 / 14 / 16 / 20 / 24 / 30，行高 1.5–1.7
    间距  4 基数：4 8 12 16 24 32 48
    圆角  6 / 10 / 14 / 999
  无障碍  focus-visible 可见环 · 图标按钮带 aria-label · 弹层 role=dialog
          · Esc 关闭 · prefers-reduced-motion 关闭位移与呼吸
  状态    每页覆盖：空 / 加载 / 无结果 / 离线 / 解析中 / 已选中
  ============================================================
-->
<style>
:root{
  --ink:#16181D; --ink-2:#3F434C; --ink-3:#6B707B;
  --bg:#FBFBF9; --surface:#fff; --rail:#F3F3F0;
  --line:#E6E6E2; --line-2:#D2D3CE;
  --accent:#3F4EA8; --accent-soft:#EDEFF9;
  --arg:#4B57B8; --data:#2F8F8A; --counter:#B8555F; --idea:#B8873F;
  --ok:#2F6B4F; --warn:#8A6A2F; --danger:#9B4A4A;
  --sh-1:0 1px 2px rgba(22,24,29,.05);
  --sh-2:0 6px 22px rgba(22,24,29,.07);
  --sh-3:0 18px 52px rgba(22,24,29,.16);
  --r-1:6px; --r-2:10px; --r-3:14px;
  --rail-w:236px; --tab-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DCDCD8;border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ---------- 骨架：移动优先 ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);height:100dvh;width:100%;overflow-x:hidden}
.rail{display:none}
.main{position:relative;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  height:52px;padding:0 16px;background:rgba(251,251,249,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
@media (min-width:1024px){.top .backbtn{display:none!important}}
@media (min-width:1024px){.top h1{display:none}.top{height:0;padding:0;border-bottom:1px solid var(--line);position:static;backdrop-filter:none;background:transparent}}
.top .grow{flex:1}
.view{padding:16px 16px calc(var(--tab-h) + 28px);max-width:1080px;margin:0 auto}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--tab-h);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--ink-3)}
.tabbar a.on{color:var(--accent)}
.tabbar a .ic{font-size:17px;line-height:1}

@media (min-width:768px){
  .view{padding:22px 24px 60px}
  .top{height:56px;padding:0 24px}
  .top h1{font-size:18px}
}
@media (min-width:1024px){
  .app{grid-template-columns:var(--rail-w) 1fr}
  .rail{
    display:flex;flex-direction:column;gap:2px;padding:16px 12px;
    background:var(--rail);border-right:1px solid var(--line);overflow:hidden;
  }
  .tabbar{display:none}
  .view{padding:26px 28px 80px}
  .top{height:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- 侧栏 ---------- */
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700}
.brand b{font-size:14.5px}
.brand .en{font-size:9px;letter-spacing:.16em;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a,.nav button{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
  color:var(--ink-2);font-size:13px;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:#E9E9E5;color:var(--ink)}
.nav a.on{background:#E2E2DD;color:var(--ink);font-weight:600}
.nav .ic{width:16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail .sep{height:1px;background:var(--line);margin:12px 8px}
.rail .lbl{font-size:10px;letter-spacing:.13em;color:var(--ink-3);padding:2px 9px 6px}
.rail .foot{margin-top:auto;padding:10px 9px 2px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink-3);line-height:1.9}
kbd{font-family:inherit;background:#fff;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;font-size:10px;color:var(--ink-2)}

/* ---------- 原子 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;
  border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line-2);background:#fff;
  color:var(--ink);box-shadow:var(--sh-1);transition:transform .18s,border-color .18s,background .18s}
.btn:hover{border-color:#BEBFBA;background:#FCFCFB}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2A2D35}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:#37449A}
.btn.gho{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.gho:hover{background:#EFEFEC;color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:4px;
  font-size:11px;font-weight:500;background:#F0F0ED;color:var(--ink-2);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:#EDF5F0;color:var(--ok)}
.tag.warn{background:#FAF4E8;color:var(--warn)}
.tag.dg{background:#F8EFEF;color:var(--danger)}
.src{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:10px;font-weight:700;flex:none}
.src.web{background:#EDF2F8;color:#3E628F}
.src.doc{background:#F1EFF8;color:#544B8C}
.src.book{background:#F4EFE7;color:#835F35}
.src.img{background:#EEF2EE;color:#4E6553}
.src.note{background:#F2F2EF;color:#5F5F58}
h2.sec{font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:22px 0 9px}
.sub{font-size:12px;color:var(--ink-3)}

/* ---------- 收件箱 ---------- */
.phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.phead .grow{flex:1;min-width:0}
.phead h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
@media (max-width:1023px){.phead h2{display:none}}
.phead .d{font-size:12px;color:var(--ink-3);margin-top:3px}
.feed{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;overflow:hidden;box-shadow:var(--sh-1)}
.row{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .14s;align-items:flex-start}
.row:last-child{border-bottom:none}
.row:hover{background:#FCFCFB}
.row .body{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:600;line-height:1.5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .o{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.row .m{display:flex;gap:7px;align-items:center;margin-top:6px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.dot.off{background:transparent}
.row .act{opacity:0;transition:.15s;align-self:center}
.row:hover .act,.row:focus-within .act{opacity:1}
.row.sel{background:var(--accent-soft)}
.chk{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;margin-top:2px;
  display:grid;place-items:center;flex:none;background:#fff}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-checked="true"]::after{content:"";width:8px;height:4px;border-left:2px solid #fff;
  border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}

/* 空状态 */
.empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
.empty .big{font-size:15px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.empty .h{font-size:12.5px;margin-bottom:16px;line-height:1.7}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- 详情 ---------- */
.dgrid{display:grid;grid-template-columns:1fr;gap:20px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.dsrc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-bottom:9px;flex-wrap:wrap}
.dtitle{font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-.015em;margin-bottom:11px}
.one{font-size:14.5px;line-height:1.7;background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:11px 14px;border-radius:0 8px 8px 0;color:var(--ink)}
.pts{list-style:none;display:flex;flex-direction:column;gap:7px}
.pts li{display:flex;gap:9px;font-size:13px;color:var(--ink-2);line-height:1.65}
.pts li i{font-style:normal;color:var(--ink-3);font-size:11px;width:16px;flex:none;padding-top:1px}
.fields{display:grid;grid-template-columns:1fr;gap:8px}
.field{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#FCFCFB;position:relative}
.field .k{font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:4px}
.field .v{font-size:12.5px;line-height:1.6}
.field .cp{position:absolute;right:6px;top:6px;opacity:.4}
.field:hover .cp{opacity:1}
.qb{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.8;background:#F7F7F5;
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink-2);white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:18px}
.orig{border-top:1px solid var(--line);padding-top:16px}
.orig p{font-size:13px;line-height:1.95;color:var(--ink-2);margin-bottom:11px}
.orig mark{background:#FCEFC4;padding:1px 2px;border-radius:2px;box-shadow:0 0 0 2px #FCEFC4}
.stale{background:#FAF4E8;border:1px solid #EADFC2;color:var(--warn);font-size:11.5px;
  padding:8px 10px;border-radius:6px;margin-bottom:12px}
@media (min-width:1024px){
  .dgrid{grid-template-columns:1fr 300px;gap:26px;align-items:start}
  .dgrid.reading{grid-template-columns:1fr 1fr}
  .fields{grid-template-columns:1fr 1fr}
  .side{position:sticky;top:76px}
}

/* ---------- 关联侧栏 ---------- */
.rel{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;overflow:hidden;box-shadow:var(--sh-1)}
.rel .rh{display:flex;gap:8px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.rel .rh .n{font-size:11px;color:var(--ink-3);font-weight:400}
.rc{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.rc:last-child{border-bottom:none}
.rc:hover{background:#FCFCFB}
.rc .t{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:3px}
.rc .r{font-size:11px;color:var(--accent);display:flex;gap:5px;align-items:center}
.rc .r::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent)}
.rf{display:flex;border-top:1px solid var(--line)}
.rf button{flex:1;padding:9px;font-size:11.5px;color:var(--ink-2)}
.rf button:hover{background:#F6F6F4}
.rf button+button{border-left:1px solid var(--line)}

/* ---------- 素材库：图 / 列表 ---------- */
.libbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.libbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff;flex:none}
.seg button{padding:6px 12px;font-size:12px;color:var(--ink-2);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.glegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.glegend button{padding:4px 2px;font-size:11.5px;background:none;border:none;
  color:var(--ink-2);display:flex;gap:6px;align-items:center;line-height:1;transition:.15s}
.glegend button:hover{color:var(--ink)}
.glegend button[aria-pressed="false"]{opacity:.32}
.glegend i{width:6px;height:6px;border-radius:50%;flex:none}
.ghint{font-size:11px;color:var(--ink-3);letter-spacing:.01em}
#gwrap{position:relative;border:1px solid rgba(22,24,29,.07);border-radius:12px;overflow:hidden;
  max-width:1040px;
  background:#FCFCF9;height:clamp(340px,calc(100dvh - 372px),620px);min-height:320px;
  box-shadow:0 1px 2px rgba(22,24,29,.03)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block;outline:none;
  touch-action:none;user-select:none;-webkit-user-select:none}
#cv.drag{cursor:grabbing}
#cv:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.gtools{position:absolute;left:12px;bottom:12px;display:flex;z-index:3;
  border:1px solid rgba(22,24,29,.09);border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(22,24,29,.07)}
.gtools button{padding:6px 11px;font-size:11.5px;color:var(--ink-2);background:none;line-height:1.2}
.gtools button+button{border-left:1px solid rgba(22,24,29,.07)}
.gtools button:hover{background:rgba(22,24,29,.045);color:var(--ink)}
.ghintbr{position:absolute;right:13px;bottom:15px;z-index:3;font-size:10.5px;color:#AAADB6;
  pointer-events:none;letter-spacing:.02em}
@media (max-width:640px){.ghint,.ghintbr{display:none}
  #gwrap{height:clamp(300px,calc(100dvh - 470px),470px);max-width:none}}
.cards{display:grid;grid-template-columns:1fr;gap:9px}
.card{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;padding:12px 13px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:.16s;box-shadow:var(--sh-1);text-align:left;width:100%}
.card:hover{border-color:var(--line-2);box-shadow:var(--sh-2);transform:translateY(-1px)}
.card .t{font-size:13px;font-weight:600;line-height:1.45}
.card .o{font-size:11.5px;color:var(--ink-3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card .m{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--ink-3)}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.cards{grid-template-columns:repeat(3,1fr)}}

/* ---------- 检索（三段式） ---------- */
.sbox{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:var(--r-2);
  background:#fff;padding:11px 13px;box-shadow:var(--sh-1)}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sbox input{flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0}
.sbox input::placeholder{color:var(--ink-3)}
.sugg{margin-top:10px}
.sugg .k{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.sugg .chips{display:flex;gap:6px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:100px;
  border:1px solid var(--line-2);background:#fff;font-size:12px;color:var(--ink-2);transition:.15s}
.schip:hover{border-color:var(--accent);color:var(--accent);background:#FBFBFE}
.schip b{font-weight:600;color:var(--accent);font-size:10.5px}
.schip .lab{font-size:10px;color:var(--ink-3);border-left:1px solid var(--line);padding-left:6px}
.res{margin-top:16px;display:flex;flex-direction:column;gap:3px}
.rrow{padding:12px 13px;border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:.14s;background:#fff;margin-bottom:6px}
.rrow:hover{background:#fff;border-color:var(--line);box-shadow:var(--sh-1)}
.rrow .t{font-size:13.5px;font-weight:600;margin-bottom:4px}
.rrow .s{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:6px}
.rrow mark{background:#FCEFC4;padding:0 2px;border-radius:2px}
.rrow .m{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.why{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-size:10.5px;font-weight:600}

/* ---------- 合辑 ---------- */
.clist{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;overflow:hidden;box-shadow:var(--sh-1)}
.ci{display:flex;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);align-items:flex-start}
.ci:last-child{border-bottom:none}
.ci .n{font-size:11px;color:var(--ink-3);width:16px;padding-top:2px;font-variant-numeric:tabular-nums}
.ci .b{flex:1;min-width:0}
.ci .t{font-size:13px;font-weight:600;margin-bottom:3px}
.ci .q{font-size:12px;color:var(--ink-2);line-height:1.6}
.ci .r{font-size:11px;color:var(--ink-3);margin-top:4px}
.cbar{display:flex;gap:9px;align-items:center;margin-top:13px;flex-wrap:wrap}

/* ---------- 设置 ---------- */
.stat{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:18px}
.stat .s{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;padding:13px 15px}
.stat .n{font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px}
.stat .l{font-size:11.5px;color:var(--ink-3)}
@media (min-width:700px){.stat{grid-template-columns:repeat(3,1fr)}}
.setlist{border:1px solid var(--line);border-radius:var(--r-2);background:#fff;overflow:hidden}
.setrow{display:flex;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .g{flex:1;min-width:0}
.setrow .t{font-size:13px;font-weight:600}
.setrow .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ---------- 弹层通用 ---------- */
.ov{position:fixed;inset:0;background:rgba(20,22,27,.5);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ov.center{align-items:center}
.sheet{width:100%;background:var(--bg);border-radius:var(--r-3) var(--r-3) 0 0;box-shadow:var(--sh-3);
  max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:768px){
  .sheet{max-width:760px;border-radius:var(--r-3);margin-bottom:4vh}
}

const FACE_OF = { idle:PET.faceSerious, serious:PET.faceSerious, happy:PET.faceHappy,
                  panic:PET.facePanic, think:PET.faceThink, sleep:PET.faceSleep };
/* 页灵：真实立绘（透明底 PNG 内嵌）。expr 只做姿态微调，避免多套资源 */
function petSvg(size=120, pose="idle"){
  const src = pose==="shrug" ? PET.shrug : PET.idle;
  return `<img src="${src}" alt="页灵小拾" class="petimg"
    style="width:${size}px;height:${Math.round(size*1.22)}px">`;
}
function petAvatar(expr){
  const src = FACE_OF[expr] || PET.faceSerious;
  return `<span class="petface" aria-hidden="true" style="background-image:url(${src})"></span>`;
}

/* ============================================================
   4. 页灵 / 留言
   ============================================================ */
let petExpr = "idle";
/* ============================================================
   4B. 页灵：可拖动、会动、随手对话
   ============================================================ */
const PetUI = {
  pos: null,          // {x,y} 左上角，null 表示用默认右下角
  dragging: false,
  dragFrom: null,
  moved: 0,
  timer: 0,
  dockOpen: false
};

function petDefaultPos(){
  const w = window.innerWidth, h = window.innerHeight;
  const isDesk = w >= 1024;
  const pw = isDesk ? 112 : 96, ph = isDesk ? 146 : 124;
  const tab = w < 1024 ? 56 : 0;
  return { x: w - pw - (isDesk ? 14 : 8), y: h - ph - tab - (isDesk ? 10 : 6) };
}

function renderPet(){
  const el = $("#pet");
  if(!el.dataset.mounted){
    el.innerHTML = `<img alt="页灵小拾" draggable="false">`;
    el.dataset.mounted = "1";
    bindPetDrag();
  }
  const img = el.querySelector("img");
  img.src = (petExpr === "shrug") ? PET.shrug : PET.idle;
  placePet();
}

function placePet(){
  const el = $("#pet");
  const p = PetUI.pos || petDefaultPos();
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  positionPetUI();
}

function positionPetUI(){
  const el = $("#pet"); if(!el) return;
  const r = el.getBoundingClientRect();

  // 气泡：页灵上方，若顶到屏幕则放下方
  const bub = $("#petbub");
  if(bub && bub.classList.contains("on")){
    const bw = bub.offsetWidth || 190, bh = bub.offsetHeight || 40;
    let bx = r.left + r.width/2 - bw + 12;
    let by = r.top - bh - 8;
    if(by < 60) by = r.bottom + 8;
    bx = Math.max(8, Math.min(window.innerWidth - bw - 8, bx));
    bub.style.left = bx + "px"; bub.style.top = by + "px";
    bub.style.right = "auto"; bub.style.bottom = "auto";
  }

  // 随手对话框
  const d = $("#petdock");
  if(d && d.classList.contains("on")){
    const dw = d.offsetWidth || 248, dh = d.offsetHeight || 180;
    let dx = r.left + r.width/2 - dw/2;
    let dy = r.top - dh - 10;
    if(dy < 64) dy = r.bottom + 10;
    dx = Math.max(8, Math.min(window.innerWidth - dw - 8, dx));
    dy = Math.max(8, Math.min(window.innerHeight - dh - 8, dy));
    d.style.left = dx + "px"; d.style.top = dy + "px";
  }
}

function bindPetDrag(){
  const el = $("#pet");
  el.addEventListener("pointerdown", e=>{
    if(e.button !== undefined && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    PetUI.dragging = true; PetUI.moved = 0;
    PetUI.dragFrom = { px:e.clientX, py:e.clientY, x:r.left, y:r.top };
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener("pointermove", e=>{
    if(!PetUI.dragging) return;
    const dx = e.clientX - PetUI.dragFrom.px, dy = e.clientY - PetUI.dragFrom.py;
    PetUI.moved = Math.max(PetUI.moved, Math.hypot(dx,dy));
    const w = el.offsetWidth, h = el.offsetHeight;
    const x = Math.max(4, Math.min(window.innerWidth - w - 4, PetUI.dragFrom.x + dx));
    const y = Math.max(4, Math.min(window.innerHeight - h - 4, PetUI.dragFrom.y + dy));
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.transform = `rotate(${Math.max(-6, Math.min(6, dx*0.04))}deg)`;
    positionPetUI();
  });
  el.addEventListener("pointerup", e=>{
    if(!PetUI.dragging) return;
    PetUI.dragging = false;
    el.classList.remove("dragging");
    el.style.transform = "";
    const r = el.getBoundingClientRect();
    if(PetUI.moved > 6){
      PetUI.pos = { x:r.left, y:r.top };
      try{ localStorage.setItem("shiye_pet", JSON.stringify(PetUI.pos)); }catch(_){}
      petReact("nod");
      positionPetUI();
    } else {
      togglePetDock();
    }
  });
  el.addEventListener("dblclick", ()=>{
    PetUI.pos = null;
    try{ localStorage.removeItem("shiye_pet"); }catch(_){}
    placePet(); petReact("hop");
    pdMsg("我回到角落了", "pet");
  });
  el.addEventListener("keydown", e=>{
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); togglePetDock(); }
  });
}

/* 动作 */
function petReact(kind){
  const el = $("#pet"); if(!el) return;
  const cls = kind === "hop" ? "hop" : kind === "shake" ? "shake"
            : kind === "nod" ? "nod" : kind === "peek" ? "peek" : "";
  if(!cls) return;
  el.classList.remove("hop","shake","nod","peek");
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), 700);
}
/* 姿态：说话时换姿势，说完还原 */
function petPose(pose, ms=1400){
  const img = $("#pet img"); if(!img) return;
  if(pose === "shrug"){
    img.src = PET.shrug;
    setTimeout(()=>{ img.src = PET.idle; }, ms);
  }
}

/* 随手对话 */
function togglePetDock(force){
  const d = $("#petdock");
  const on = force === undefined ? !d.classList.contains("on") : force;
  PetUI.dockOpen = on;
  d.classList.toggle("on", on);
  if(on) $("#petbub").classList.remove("on");
  document.body.classList.toggle("dockopen", on);
  if(on){
    if(!d.dataset.ready){

function pdMsg(text, who="pet", results){
  const box = $("#pdMsgs"); if(!box) return;
  const mine = who === "me";
  const div = document.createElement("div");
  div.className = "pdmsg" + (mine ? " me" : "");
  div.innerHTML = (mine ? "" : `<span class="av" style="background-image:url(${PET.faceSerious})"></span>`)
    + `<span class="tx">${esc(text)}</span>`;
  box.appendChild(div);
  if(results && results.length){
    const wrap = document.createElement("div");
    wrap.className = "pdres";
    results.forEach(h=>{
      const b = document.createElement("button");
      b.innerHTML = `${esc(h.it.t)}<i>${h.fieldName} · ${clusterOf(h.it.id).n}</i>`;
      b.onclick = ()=>{ togglePetDock(false); S.id = h.it.id; S.reading = false; go("#/detail/"+h.it.id); };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }
  while(box.children.length > 9) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  positionPetUI();
}
function pdSend(){
  const inp = $("#pdInput"); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  pdMsg(v, "me"); inp.value = "";
  setTimeout(()=>{
    const hits = search(v).slice(0,3);
    if(hits.length){
      pdMsg(`找到 ${hits.length} 条：`, "pet", hits);
      petReact("hop");
    } else if(/存|扔|记|收/.test(v)){
      pdMsg("收好了，先不归类。", "pet"); petReact("nod");
    } else {
      pdMsg("翻乱了…换个说法？", "pet"); petPose("shrug"); petReact("shake");
    }
  }, 420);
}

/* 空闲时的小动作：轻微张望，不打扰 */
function petIdleLoop(){
  clearTimeout(PetUI.timer);
  PetUI.timer = setTimeout(()=>{
    if(!PetUI.dragging && !PetUI.dockOpen){
      const r = Math.random();
      if(r < .38) petReact("peek");
      else if(r < .6) petReact("nod");
    }
    petIdleLoop();
  }, 7000 + Math.random()*6000);
}

let bubTimer;
function say(text, ms=3600){          // 只出气泡，不进留言列
  if(PetUI.dockOpen){ pushComment(text); return; }   // 对话框开着时改走留言列，别打架
  const b=$("#petbub"); b.textContent=text; b.classList.add("on");
  positionPetUI();
  clearTimeout(bubTimer); bubTimer=setTimeout(()=>{ b.classList.remove("on"); },ms);
  petExpr = /好|归|收/.test(text) ? "happy" : "idle";
  renderPet();
}
function notify(text){ say(text); pushComment(text); }   // 需要留痕时才进留言列
function pushComment(text){
  S.cmts.push({text, t:Date.now(), expr: pick(["idle","happy","panic"])});
  if(S.cmts.length>3) S.cmts.shift();
  renderComments();
  $("#cmts").classList.remove("folded");
  $("#cmtfold").classList.remove("on");
  scheduleFold();
}
function scheduleFold(){
  clearTimeout(S.cmtTimer);
  S.cmtTimer = setTimeout(()=>{
    if(!S.cmts.length) return;
    $("#cmts").classList.add("folded");
    const f=$("#cmtfold"); f.classList.add("on"); f.textContent=`小拾 · ${S.cmts.length}`;
  }, 8000);
}
function renderComments(){
  $("#cmts").innerHTML = S.cmts.map(c=>`
    <div class="cmt" role="button" tabindex="0">
      <span class="av">${petAvatar(c.expr)}</span>
      <span class="tx">${esc(c.text)}</span>

  $$("#cmts .cmt").forEach(el=>{
    const open=()=>{ go("#/chat"); };
    el.onclick=open;
    el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();open();} };
  });
}
$("#cmtfold").onclick = ()=>{

/* ============================================================
   9. P6 检索（三段式）
   ============================================================ */
const SYN = {
  "注意力":["attention span","持续注意","注意力经济","注意力时长"],
  "算法":["推荐系统","完播率","信息流","个性化推荐"],
  "茧房":["信息茧房","同质化","回音室","收敛"],
  "短视频":["短格式视频","短视频平台","刷视频"],
  "时长":["使用时长","单日时长","停留"]
};
function suggest(q){
  if(!q) return [];
  const base = q.trim();
  const syn = (SYN[base] || SYN[Object.keys(SYN).find(k=>base.includes(k))] || [base+" 数据", base+" 研究"])[0];
  const field = ITEMS.find(i=>i.body.join("").includes(base)) || ITEMS.find(i=>i.t.includes(base));
  const frag = field ? field.pts[0].slice(0,10) : base+" 的结论";
  return [
    {lab:"收窄", text:`${base} 数据 2024`},
    {lab:"换说法", text:syn},
    {lab:"原文反推", text:frag}
  ].filter(s=>s.text && s.text!==base);
}
function search(q){
  const query = q.trim().toLowerCase();
  if(!query) return [];
  const out=[];
  ITEMS.forEach(it=>{
    let score=0, fieldName="", snip="";
    if(it.t.toLowerCase().includes(query)){ score+=6; fieldName="命中标题"; snip=""; }
    if(it.one.toLowerCase().includes(query)){ score+=4; fieldName=fieldName||"命中摘要"; snip=snip||it.one; }
    if(it.pts.join("").toLowerCase().includes(query)){ score+=3; fieldName=fieldName||"命中要点"; snip=snip||it.pts.find(p=>p.toLowerCase().includes(query)); }
    const bi = it.body.findIndex(p=>p.toLowerCase().includes(query));
    if(bi>=0){ score+=2; fieldName=fieldName||`命中原文 · 第 ${bi+1} 段`; snip=snip||it.body[bi]; }
    if(it.core.toLowerCase().includes(query)){ score+=2; fieldName=fieldName||"命中结论"; snip=snip||it.core; }
    if(score) out.push({it,score,fieldName,snip});
  });
  return out.sort((a,b)=>b.score-a.score);
}
function hl(text,q){
  if(!q) return esc(text);
  const t = q.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return esc(text).replace(new RegExp("("+t+")","gi"),"<mark>$1</mark>");
}
function viewSearch(){
  const q = S.q.trim();
  const hits = q ? search(q) : [];
  const sugg = q ? suggest(q) : [];
  const recents = ITEMS.slice(0,4);

  const resHTML = !q
    ? `<h2 class="sec">最近打开</h2><div class="res">${recents.map(it=>`
        <div class="rrow" data-open="${it.id}" role="button" tabindex="0">
          <div class="t">${esc(it.t)}</div>
          <div class="m"><span class="src ${it.src}" style="width:16px;height:16px;font-size:9px">${ICON[it.src]}</span>
            ${esc(it.srcName)} · ${it.date}</div>
        </div>`).join("")}</div>`
    : hits.length
      ? `<div class="sub" style="margin:14px 0 6px">${hits.length} 条结果 · 按命中字段加权排序</div>
         <div class="res">${hits.map(h=>`
          <div class="rrow" data-open="${h.it.id}" role="button" tabindex="0">
            <div class="t">${hl(h.it.t,q)}</div>
            <div class="s">${hl(h.snip||h.it.one,q)}</div>
            <div class="m"><span class="src ${h.it.src}" style="width:16px;height:16px;font-size:9px">${ICON[h.it.src]}</span>
              ${esc(h.it.srcName)} · ${esc(clusterOf(h.it.id).n)}
              <span class="why">${h.fieldName}</span>
              ${h.it.id%4===0?'<span class="tag">未读</span>':''}
            </div>
          </div>`).join("")}</div>`
      : `<div class="empty">
           <div class="big">没有找到「${esc(q)}」</div>
           <div class="h">试试更短的关键词，或使用 AI 找资料</div>
           <div class="acts">
             <button class="btn sm" data-act="clear-q">清空重搜</button>
             <button class="btn sm" data-act="start-triage">去整理 ${ITEMS.filter(i=>!i.triaged).length} 条</button>
           </div>
         </div>`;

  return `
  <div class="phead"><div class="grow"><h2>检索</h2>
    <div class="d">一个输入框。标题、摘要、要点、原文正文都能搜到</div></div></div>
  <div class="sbox">
    <span aria-hidden="true" style="color:var(--ink-3)">⌕</span>
    <input id="q" value="${esc(q)}" placeholder="输入关键词；自然语言请点 AI 找资料" aria-label="检索资料">
    ${q?`<button class="btn sm gho" data-act="clear-q" aria-label="清空">✕</button>`:""}
  </div>
  ${sugg.length?`<div class="sugg"><div class="k">小拾想了三个说法</div>
    <div class="chips">${sugg.map(s=>`<button class="schip" data-q="${esc(s.text)}">
      <b>${s.lab}</b>${esc(s.text)}</button>`).join("")}</div></div>`:""}
  <div id="reswrap">${resHTML}</div>`;
}

/* ============================================================
   16. 图引擎（2.5D）
   ============================================================ */
const G = {nodes:[],edges:[],cam:{x:0,y:0,zoom:1},hover:null,sel:null,focus:null,
           tween:null,W:0,H:0,raf:0,mode:0,adj:{},par:{x:0,y:0,tx:0,ty:0},born:undefined,
           meta:[],vel:{x:0,y:0},drag:false,ro:null,cv:null};
const FOCAL=2200, SS=2;

/* 确定性伪随机：同一份数据永远得到同一张图，空间记忆不被破坏 */
const jit = i => { const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); };

function initGraph(){
  G.nodes = ITEMS.filter(it=>!S.libGroup || it.cid===S.libGroup).map(it=>{
    const h = jit(it.id*3.11);
    return {it, cid:it.cid, x:0,y:0,z:0,tx:0,ty:0,_px:0,_py:0,deg:0,
            r: 4.8 + 1.9*h,
            phase: jit(it.id*7.7)*6.283};
  });
  layoutGraph();
  buildGEdges();
  buildMeta();
  // 切视图会重建节点数组，旧的选中/悬停对象已经失效，必须清掉
  G.sel=null; G.hover=null; G.vel.x=0; G.vel.y=0; G.tween=null; G.drag=false;
  G.born=undefined;
}

function buildMeta(){
  G.meta = CLUSTERS.map((c,ci)=>{
    const l=G.nodes.filter(n=>n.cid===c.id);
    if(!l.length) return null;
    const cx=l.reduce((a,n)=>a+n.x,0)/l.length;
    const cy=l.reduce((a,n)=>a+n.y,0)/l.length;
    let sp=0; l.forEach(n=>{ sp=Math.max(sp,Math.hypot(n.x-cx,n.y-cy)); });
    return {c,l,cx,cy,ci,spread:Math.max(40,sp)};
  }).filter(Boolean);
}

/* 布局：有机分布，但簇心仍落在设计位置上 */
function layoutGraph(){
  const M = G.mode===0 ? 1 : 1.22;
  CLUSTERS.forEach((c,ci)=>{
    const l=G.nodes.filter(n=>n.cid===c.id);
    l.forEach((n,i)=>{
      const a=jit(n.it.id*1.73)*6.2832;
      const rr=(10+44*Math.pow(jit(n.it.id*2.71),0.62))*M;
      n.tx=c.x+Math.cos(a)*rr*1.10;
      n.ty=c.y+Math.sin(a)*rr*0.78;
      n.x=n.tx; n.y=n.ty;
      n.z=(jit(n.it.id*6.9)-0.5)*40;
    });
    for(let it=0; it<90; it++){
      for(let i=0;i<l.length;i++){
        for(let j=i+1;j<l.length;j++){
          const A=l[i],B=l[j];
          let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy);
          if(d<0.001){ dx=0.31; dy=0.22; d=0.38; }
          const min=37;
          if(d<min){ const f=(min-d)/d*0.5; A.x-=dx*f; A.y-=dy*f; B.x+=dx*f; B.y+=dy*f; }
        }
      }
      l.forEach(n=>{ n.x+=(n.tx-n.x)*0.02; n.y+=(n.ty-n.y)*0.02; });
    }
    const mx=l.reduce((a,n)=>a+n.x,0)/l.length, my=l.reduce((a,n)=>a+n.y,0)/l.length;
    l.forEach(n=>{ n.x+=c.x-mx; n.y+=c.y-my; });
  });
}

/* 连线：簇内取最近邻成网；跨簇只连"方位相邻 + 文本相近"的两簇 */
function bg2(s){
  s=String(s).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"");
  const m=new Map();
  for(let i=0;i<s.length-1;i++){ const g=s.slice(i,i+2); m.set(g,(m.get(g)||0)+1); }
  return m;
}
function simi(a,b){
  const A=bg2(a), B=bg2(b);
  let inter=0, tot=0;
  A.forEach((v,k)=>{ tot+=v; if(B.has(k)) inter+=Math.min(v,B.get(k)); });
  B.forEach(v=>{ tot+=v; });
  return tot ? (2*inter)/tot : 0;
}
function buildGEdges(){
  G.edges=[]; G.adj={}; const seen=new Set();
  const add=(A,B,kind)=>{
    const key=[A.it.id,B.it.id].sort().join("-")+"|"+kind;
    if(seen.has(key)) return; seen.add(key);
    G.edges.push({a:A,b:B,kind});
    (G.adj[A.it.id]=G.adj[A.it.id]||new Set()).add(B.it.id);
    (G.adj[B.it.id]=G.adj[B.it.id]||new Set()).add(A.it.id);
    A.deg++; B.deg++;
  };
  CLUSTERS.forEach(c=>{
    const l=G.nodes.filter(n=>n.cid===c.id);
    l.forEach(A=>{
      l.filter(n=>n!==A)
       .sort((p,q)=>Math.hypot(p.x-A.x,p.y-A.y)-Math.hypot(q.x-A.x,q.y-A.y))
       .slice(0,2)
       .forEach(B=>add(A,B,"in"));
    });
  });
  Object.entries(REL).forEach(([a,rs])=>rs.forEach(r=>{
    const A=G.nodes.find(n=>n.it.id===+a), B=G.nodes.find(n=>n.it.id===+r.id);
    if(A&&B && Math.hypot(A.x-B.x,A.y-B.y)<330) add(A,B,"cross");
  }));
  const cand=[];
  for(let i=0;i<G.nodes.length;i++){
    for(let j=i+1;j<G.nodes.length;j++){
      const A=G.nodes[i], B=G.nodes[j];
      if(A.cid===B.cid) continue;
      if(Math.hypot(A.x-B.x,A.y-B.y)>300) continue;
      const s=Math.max(simi(A.it.t,B.it.t), simi(A.it.one,B.it.one)*0.8);
      if(s>0.20) cand.push({A,B,s});
    }
  }
  cand.sort((p,q)=>q.s-p.s).slice(0,10).forEach(x=>add(x.A,x.B,"cross"));
}

function gResize(){
  const cv=$("#cv"); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const w=Math.max(200,Math.round(r.width)), h=Math.max(180,Math.round(r.height));
  // 切到列表再切回来时 canvas 是新建的节点，绘制缓冲只有默认 300×150，
  // 只比较尺寸会把新元素当成旧的而提前返回 —— 必须同时比较元素本身。
  const fresh = G.cv !== cv;
  if(!fresh && w===G.W && h===G.H && cv.width===Math.round(w*SS)) return;
  G.cv=cv; G.W=w; G.H=h;
  cv.width=Math.round(w*SS); cv.height=Math.round(h*SS);
}

/* 只做很轻的景深：远的略小、略淡，不做模糊 */
function gProject(n,t){
  const tt=t||0;
  const dx=Math.sin(tt*0.36+n.phase)*1.6;
  const dy=Math.cos(tt*0.31+n.phase*1.7)*1.3;
  const zz=(n.z||0);
  const k=FOCAL/(FOCAL+zz*1.4);
  const s=G.cam.zoom*k;
  return {x:(n.x+dx-G.cam.x)*s+G.W/2+G.par.x,
          y:(n.y+dy-G.cam.y)*s+G.H/2+G.par.y,
          r:(n.r||5)*s, s, k};
}
function gFit(){
  if(!G.nodes.length) return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  G.nodes.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y);});
  const px=Math.max(52,G.W*0.05), py=Math.max(48,G.H*0.085);
  const z=Math.min((G.W-px*2)/Math.max(240,x1-x0), (G.H-py*2)/Math.max(200,y1-y0));
  G.cam.zoom=Math.max(.32,Math.min(1.8,z));
  G.cam.x=(x0+x1)/2;
  G.cam.y=(y0+y1)/2;
}
function tint(cid){
  const l=G.nodes.filter(n=>n.cid===cid); if(!l.length) return "#C9CBD3";
  const c={}; l.forEach(n=>c[n.it.type]=(c[n.it.type]||0)+1);
  return TYPES[Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]].c;
}
function hexA(h,a){const v=h.replace("#","");
  return `rgba(${parseInt(v.slice(0,2),16)},${parseInt(v.slice(2,4),16)},${parseInt(v.slice(4,6),16)},${a})`;}

function gRender(){
  const cv=$("#cv"); if(!cv) return;
  const ctx=cv.getContext("2d");
  ctx.setTransform(SS,0,0,SS,0,0);
  const W=G.W,H=G.H, now=performance.now()/1000;
  if(G.born===undefined) G.born=now;
  const life=Math.min(1,(now-G.born)/0.6);

  ctx.fillStyle="#FDFDFC"; ctx.fillRect(0,0,W,H);

  const hov=(G.sel||G.hover);
  const hid=hov?hov.it.id:null;
  const adj=hid!=null?(G.adj[hid]||new Set()):null;

  // 连线：单一浅灰，只靠粗细与深浅区分，不用渐变
  ctx.lineCap="round";
  G.edges.forEach((e,ei)=>{
    const A=gProject(e.a,now), B=gProject(e.b,now);
    const inFocus = !G.focus || e.a.cid===G.focus || e.b.cid===G.focus;
    const hot = hid!=null && (e.a.it.id===hid||e.b.it.id===hid);
    const dx=B.x-A.x, dy=B.y-A.y;
    const bend=((jit(ei*3.7)%1)-0.5)*0.16;
    const mx=(A.x+B.x)/2 - dy*bend, my=(A.y+B.y)/2 + dx*bend;

    if(hot){
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B.x,B.y);
      ctx.strokeStyle="rgba(63,78,168,.55)"; ctx.lineWidth=1.4; ctx.stroke();
      return;
    }
    let a = (e.kind==="in"?0.15:0.085) * (inFocus?1:0.25) * (hid!=null?0.45:1) * life;
    if(a<0.012) return;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B.x,B.y);
    ctx.strokeStyle=`rgba(24,26,32,${a.toFixed(3)})`;
    ctx.lineWidth=1;
    ctx.stroke();
  });

  // 节点：实心圆 + 白色外环，去掉所有光晕
  const order=G.nodes.slice().sort((m,n)=>m.z-n.z);
  order.forEach((n,i)=>{
    const p=gProject(n,now);
    n._px=p.x; n._py=p.y;
    const inFocus = !G.focus || n.cid===G.focus;
    const on=S.typeOn.has(n.it.type)?1:0.10;
    const near = adj&&adj.has(n.it.id)?1:(hid!=null?0.45:1);
    const appear=Math.max(0,Math.min(1,(life-i*0.006)*2.4));
    const a=inFocus*on*near*appear;
    if(a<=0.02) return;
    const col=TYPES[n.it.type].c;
    const isSel=G.sel===n, isHov=G.hover===n;
    const rad=Math.max(2.6,p.r)*(isHov||isSel?1.22:1);

    ctx.beginPath(); ctx.arc(p.x,p.y,rad+1.4,0,7);
    ctx.fillStyle=`rgba(253,253,252,${a})`; ctx.fill();

    ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7);
    ctx.fillStyle=hexA(col,Math.min(1,.92*a)); ctx.fill();

    if(isHov||isSel){
      ctx.beginPath(); ctx.arc(p.x,p.y,rad+4.5,0,7);
      ctx.strokeStyle=hexA(col,.55*a); ctx.lineWidth=1.1; ctx.stroke();
    }
  });

  // 簇名：纯文字，不加底片
  G.meta.forEach(m=>{
    const l=m.l;
    if(!l.length) return;
    const cx=l.reduce((a,n)=>a+n._px,0)/l.length;
    const top=Math.min(...l.map(n=>n._py))-13;
    const dim=(G.focus&&G.focus!==m.c.id)?0.28:1;
    const y=Math.max(14,top);

    ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.lineJoin="round";
    const nm=m.c.n, ct=l.length+" 条";
    ctx.font=`600 11.5px Inter,"PingFang SC","Microsoft YaHei"`;
    const w2=ctx.measureText(nm).width;
    ctx.font=`600 9.5px Inter,"PingFang SC","Microsoft YaHei"`;
    const wct=ctx.measureText(ct).width;
    const total=w2+6+wct;
    const x0=cx-total/2;

    ctx.lineWidth=3.4; ctx.strokeStyle=`rgba(253,253,252,${.95*dim})`;
    ctx.textAlign="left";
    ctx.strokeText(nm,x0,y);
    ctx.fillStyle=`rgba(28,30,36,${.80*dim})`; ctx.fillText(nm,x0,y);
    ctx.font=`600 9.5px Inter,"PingFang SC","Microsoft YaHei"`;
    ctx.strokeText(ct,x0+w2+7,y);
    ctx.fillStyle=`rgba(28,30,36,${.34*dim})`; ctx.fillText(ct,x0+w2+7,y);
  });

  // 悬停提示：白底细边，不用深色块
  const lb=G.sel||G.hover;
  if(lb){
    const p=gProject(lb,now);
    const txt=lb.it.t.length>18?lb.it.t.slice(0,18)+"…":lb.it.t;
    ctx.font=`500 11px Inter,"PingFang SC","Microsoft YaHei"`;
    const w=ctx.measureText(txt).width+18, h=24;
    let x0=p.x-w/2, y0=p.y+Math.max(8,p.r)+12;
    x0=Math.max(6,Math.min(G.W-w-6,x0));
    y0=Math.min(G.H-h-6,y0);
    ctx.beginPath();
    const r0=6;
    ctx.moveTo(x0+r0,y0); ctx.lineTo(x0+w-r0,y0); ctx.quadraticCurveTo(x0+w,y0,x0+w,y0+r0);
    ctx.lineTo(x0+w,y0+h-r0); ctx.quadraticCurveTo(x0+w,y0+h,x0+w-r0,y0+h);
    ctx.lineTo(x0+r0,y0+h); ctx.quadraticCurveTo(x0,y0+h,x0,y0+h-r0);
    ctx.lineTo(x0,y0+r0); ctx.quadraticCurveTo(x0,y0,x0+r0,y0);
    ctx.fillStyle="rgba(255,255,255,.97)"; ctx.fill();
    ctx.strokeStyle="rgba(24,26,32,.12)"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="rgba(24,26,32,.88)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(txt,x0+w/2,y0+h/2+.5);
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  }

  // 相机缓动 + 拖拽惯性
  if(G.tween){
    const t=G.tween; t.i=Math.min(1,t.i+.06); const e2=1-Math.pow(1-t.i,3);
    G.cam.x=t.x0+(t.x1-t.x0)*e2; G.cam.y=t.y0+(t.y1-t.y0)*e2;
    G.cam.zoom=t.z0+(t.z1-t.z0)*e2;
    if(t.i>=1) G.tween=null;
  }
  if(!G.drag && (Math.abs(G.vel.x)>0.3||Math.abs(G.vel.y)>0.3)){
    G.cam.x-=G.vel.x/G.cam.zoom; G.cam.y-=G.vel.y/G.cam.zoom;
    G.vel.x*=0.90; G.vel.y*=0.90;
  }
  G.par.x+=(G.par.tx-G.par.x)*0.07;
  G.par.y+=(G.par.ty-G.par.y)*0.07;

  G.raf=requestAnimationFrame(gRender);
}

function gFly(x,y,z){ G.tween={x0:G.cam.x,y0:G.cam.y,z0:G.cam.zoom,x1:x,y1:y,z1:z,i:0}; }
function gPick(mx,my){
  let best=null,bd=1e9;
  G.nodes.forEach(n=>{
    const p=gProject(n);
    const d=Math.hypot(p.x-mx,p.y-my);
    if(d<Math.max(13,p.r+9) && d<bd){ best=n; bd=d; }
  });
  return best;
}

function gBind(){
  const cv=$("#cv"); if(!cv) return;
  gResize(); gFit(); gRender();

  const lg=$("#glegend");
  if(lg){
    lg.innerHTML=Object.entries(TYPES).map(([k,v])=>
      `<button data-t="${k}" aria-pressed="${S.typeOn.has(k)}"><i style="background:${v.c}"></i>${v.n}</button>`).join("");
    lg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const k=b.dataset.t; S.typeOn.has(k)?S.typeOn.delete(k):S.typeOn.add(k);
      if(!S.typeOn.size) S.typeOn=new Set(Object.keys(TYPES));
      b.setAttribute("aria-pressed",S.typeOn.has(k));
    });
  }
  const fit=$("#gfit"), relay=$("#grelay");
  if(fit) fit.onclick=()=>{ G.focus=null; G.sel=null; gFit(); };
  if(relay) relay.onclick=()=>{ G.mode=(G.mode+1)%2; layoutGraph(); buildMeta();
    G.sel=null; G.hover=null; gFit(); toast("换了一种秩序，位置仍然固定"); };

  let drag=false,moved=0,lx=0,ly=0,vx=0,vy=0;

  // 用 pointer capture 把事件锁在画布上：不用 window 监听，避免每次重绘叠加监听器
  cv.addEventListener("pointerdown",e=>{
    cv.setPointerCapture(e.pointerId);
    drag=true; moved=0; lx=e.clientX; ly=e.clientY; vx=vy=0;
    G.vel.x=G.vel.y=0; G.drag=true; cv.classList.add("drag");
  });
  cv.addEventListener("pointermove",e=>{
    const r=cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    if(drag){
      const dx=e.clientX-lx, dy=e.clientY-ly;
      moved+=Math.abs(dx)+Math.abs(dy);
      G.cam.x-=dx/G.cam.zoom; G.cam.y-=dy/G.cam.zoom;
      vx=dx; vy=dy; lx=e.clientX; ly=e.clientY; G.tween=null;
    } else {
      G.hover=gPick(mx,my);
      cv.style.cursor=G.hover?"pointer":"grab";
    }
  });
  cv.addEventListener("pointerup",e=>{
    if(!drag) return;
    cv.releasePointerCapture(e.pointerId);
    const r=cv.getBoundingClientRect();
    if(moved<6){
      const mx=e.clientX-r.left, my=e.clientY-r.top;
      const n=gPick(mx,my);
      if(n){ G.sel=n; G.focus=n.cid; openAI(n.it.id); }
      else {
        let hit=null, bd=1e9;
        G.meta.forEach(m=>{
          const p=gProject({x:m.cx,y:m.cy,z:0,r:1});
          const d=Math.hypot(p.x-mx,p.y-my);
          if(d<m.spread*p.s*1.25 && d<bd){ hit=m; bd=d; }
        });
        if(hit){ G.focus=hit.c.id; G.sel=null; gFly(hit.cx,hit.cy,Math.min(1.9,G.cam.zoom*1.45)); }
        else { G.sel=null; G.focus=null; }
      }
    } else { G.vel.x=vx; G.vel.y=vy; }
    drag=false; G.drag=false; cv.classList.remove("drag");
  });
  cv.addEventListener("pointerleave",()=>{ if(!drag) G.hover=null; });
  cv.addEventListener("dblclick",()=>{ G.focus=null; G.sel=null; gFit(); });
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const b=G.cam.zoom;
    G.cam.zoom=Math.max(.45,Math.min(2.2,G.cam.zoom*(e.deltaY>0?.92:1.09)));
    const r=cv.getBoundingClientRect();
    const mx=e.clientX-r.left-G.W/2, my=e.clientY-r.top-G.H/2;
    G.cam.x-=mx*(1/G.cam.zoom-1/b); G.cam.y-=my*(1/G.cam.zoom-1/b);
    G.tween=null;
  },{passive:false});
  cv.addEventListener("keydown",e=>{
    const step=28/G.cam.zoom;
    if(e.key==="ArrowLeft"){G.cam.x-=step;e.preventDefault();}
    if(e.key==="ArrowRight"){G.cam.x+=step;e.preventDefault();}
    if(e.key==="ArrowUp"){G.cam.y-=step;e.preventDefault();}
    if(e.key==="ArrowDown"){G.cam.y+=step;e.preventDefault();}
    if(e.key==="+"||e.key==="="){G.cam.zoom=Math.min(2.2,G.cam.zoom*1.1);e.preventDefault();}
    if(e.key==="-"){G.cam.zoom=Math.max(.45,G.cam.zoom*.9);e.preventDefault();}
    if(e.key==="Escape"){G.focus=null;G.sel=null;gFit();}
  });
  // 演示用：?hover 直接进入悬停态，便于截图核对
  if(location.hash.indexOf("?hover")>=0){
    const n=G.nodes.find(x=>x.it.id===4)||G.nodes[0];
    G.hover=n;
  }
  if(window.ResizeObserver){
    if(G.ro) G.ro.disconnect();
    G.ro=new ResizeObserver(()=>{ if($("#cv")){ gResize(); gFit(); } });
    G.ro.observe(cv.parentElement);
  }
}

function killGraph(){
  if(G.raf) cancelAnimationFrame(G.raf);
  G.raf=0;
  if(G.ro){ G.ro.disconnect(); G.ro=null; }
}

/* ============================================================
   16.5 全局命令面板（⌘K / Ctrl+K）
   任何时候按下就能搜、能跳、能存 —— 对应 mymind 的"个人搜索引擎"
   ============================================================ */
const PAL = {on:false, q:"", idx:0, rows:[]};

function palOpen(){
  PAL.on=true; PAL.q=""; PAL.idx=0;
  $("#pal").classList.add("on");
  const inp=$("#pq"); if(inp){ inp.value=""; inp.focus(); }
  palRender();
}
function palClose(){
  PAL.on=false;
  $("#pal").classList.remove("on");
}
function palActions(){
  const un=ITEMS.filter(i=>!i.triaged).length;
  return [
    {kind:"act", ic:"＋", tt:"记一条", mm:"链接、截图或一句话，先存下来", run:()=>{ palClose(); openComposer(); }},
    {kind:"act", ic:"▤", tt:"整理收件箱"+(un?` · ${un} 条`:""), mm:"AI 给三个去向，你只点一下", run:()=>{ palClose(); go("#/inbox"); openTriage(); }},
    {kind:"act", ic:"◍", tt:"打开素材库 · 网络图", mm:"看结构，看哪里还空着", run:()=>{ palClose(); go("#/library"); }},
    {kind:"act", ic:"⌕", tt:"进入检索页", mm:"可以改词、看命中在原第几段", run:()=>{ palClose(); go("#/search"); }},
    {kind:"act", ic:"◫", tt:"资料合辑", mm:()=>`${S.collection.length} 条，可直接复制带走`, run:()=>{ palClose(); go("#/collection"); }}
  ];
}
function palBuild(){
  const q=PAL.q.trim();
  if(!q){
    return [{t:"sec",label:"动作"}, ...palActions(),
            {t:"sec",label:"最近打开"},
            ...ITEMS.slice(0,3).map(it=>({kind:"item", it, mm:`${it.srcName} · ${it.date}`}))];
  }
  const hits=search(q);
  const rows=hits.slice(0,6).map(h=>({kind:"item", it:h.it, mm:`${h.fieldName} · ${h.it.srcName}`, q}));
  if(!rows.length) return [{kind:"none", tt:`没有找到「${q}」`, mm:"换个说法，或者还没整理的也能搜到"}];
  rows.push({kind:"act", ic:"⌕", tt:`在检索页看全部 ${hits.length} 条`, mm:"带三个改词建议",
             run:()=>{ palClose(); go("#/search/"+encodeURIComponent(q)); }});
  return rows;
}
function palRender(){
  const rows=palBuild();
  PAL.rows=rows.filter(r=>r.kind!=="sec");
  if(PAL.idx>=PAL.rows.length) PAL.idx=Math.max(0,PAL.rows.length-1);

  let n=-1;
  const html=rows.map(r=>{
    if(r.t==="sec") return `<div class="palsec">${esc(r.label)}</div>`;
    n++;
    const i=n, sel=i===PAL.idx;
    if(r.kind==="none")
      return `<div class="palempty" data-i="${i}">${esc(r.tt)}<span>${esc(r.mm)}</span></div>`;
    const mm=typeof r.mm==="function"?r.mm():r.mm;
    if(r.kind==="act")
      return `<div class="palrow" data-i="${i}" data-kind="act" role="option" aria-selected="${sel}">
        <span class="pi">${r.ic}</span>
        <span class="pb"><b>${esc(r.tt)}</b><i>${esc(mm||"")}</i></span>
        <span class="pk">↵</span></div>`;
    return `<div class="palrow" data-i="${i}" data-kind="item" data-id="${r.it.id}" role="option" aria-selected="${sel}">
      <span class="src ${r.it.src}" style="width:22px;height:22px;font-size:10px">${ICON[r.it.src]}</span>
      <span class="pb"><b>${r.q?hl(r.it.t,r.q):esc(r.it.t)}</b><i>${esc(mm)}</i></span>
      <span class="pk">${esc(clusterOf(r.it.id).n)}</span></div>`;
  }).join("");
  $("#plist").innerHTML=html;

  const cur=$("#plist").querySelector('[aria-selected="true"]');
  if(cur) cur.scrollIntoView({block:"nearest"});
}
function palRun(i){
  const r=PAL.rows[i];
  if(!r) return;
  if(r.kind==="item"){ palClose(); go(`#/detail/${r.it.id}`); }
  else if(r.run) r.run();
}
function palMove(d){
  if(!PAL.rows.length) return;
  PAL.idx=(PAL.idx+d+PAL.rows.length)%PAL.rows.length;
  palRender();
}
function palBind(){
  const box=$("#pal"); if(!box) return;
  box.addEventListener("click",e=>{
    const row=e.target.closest("[data-i]");
    if(row){ PAL.idx=+row.dataset.i; palRun(PAL.idx); return; }
    if(e.target===box) palClose();
  });
  const inp=$("#pq");
  inp.addEventListener("input",()=>{ PAL.q=inp.value; PAL.idx=0; palRender(); });
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); palMove(1); }
    if(e.key==="ArrowUp"){ e.preventDefault(); palMove(-1); }
    if(e.key==="Enter"){ e.preventDefault(); palRun(PAL.idx); }
    if(e.key==="Escape"){ e.preventDefault(); palClose(); }
  });
}

/* ============================================================
   17. 渲染总控
   ============================================================ */
let _viewKey="";
function render(){
  const k=S.route+"|"+(S.route==="library"?S.lib:"");
  if(_viewKey && k!==_viewKey && $("#ai") && $("#ai").classList.contains("on")) closeAI();
  _viewKey=k;
  renderShell(); renderTop(); renderPet();

  const v=$("#view");
  if(S.route==="inbox") v.innerHTML=viewInbox();
  else if(S.route==="detail") v.innerHTML=viewDetail();
  else if(S.route==="library") v.innerHTML=viewLibrary();
  else if(S.route==="search") v.innerHTML=viewSearch();
  else if(S.route==="collection") v.innerHTML=viewCollection();
  else if(S.route==="settings") v.innerHTML=viewSettings();
  else if(S.route==="welcome") v.innerHTML=viewWelcome();
  else if(S.route==="chat") v.innerHTML=viewChat();
  else v.innerHTML=viewInbox();

  killGraph();
  if(S.route==="library" && S.lib==="graph"){ initGraph(); gBind(); }

  if(S.route==="search"){ const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  // 对话页本身就在说话，页灵气泡让位
  if(S.route==="chat"){ $("#petbub").classList.remove("on"); }
  if(S.route==="chat"){ const f=$("#flow"); if(f) f.scrollTop=f.scrollHeight; }
}

/* ============================================================
   18. 事件
   ============================================================ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-open],[data-pick],[data-coll],[data-q],[data-rm],[data-tri],[data-comp],[data-lib],[data-tab],[data-kind],[data-ai],[data-toast],[data-hint]");
  if(!el) return;
  const d=el.dataset;

  if(d.open!==undefined){
    if(S.selectMode && e.target.closest("[data-pick]")) return;
    S.id=+d.open; S.reading=false; go("#/detail/"+d.open); return;
  }
  if(d.pick!==undefined){ e.stopPropagation();
    S.picked.has(+d.pick)?S.picked.delete(+d.pick):S.picked.add(+d.pick); render(); return; }
  if(d.coll!==undefined){
    const id=+d.coll;
    S.collection.includes(id)?toast("已经在合辑里了"):(S.collection.push(id),toast("已加入合辑 · "+S.collection.length+" 条"));
    render(); return;
  }
  if(d.q!==undefined){ S.q=d.q; render(); return; }
  if(d.rm!==undefined){ S.collection=S.collection.filter(x=>x!==+d.rm); render(); return; }
  if(d.lib){ S.lib=d.lib; render(); return; }
  if(d.tab){ S.tab=d.tab; renderAI(); return; }
  if(d.ai==="redo"){ S.redo++; renderAI(); toast("换了一组候选"); return; }
  if(d.ai==="close"){ closeAI(); return; }
  if(d.kind){
    const it=byId(S.id); const i=+d.i;
    if(d.kind==="place"){
      const name=el.querySelector(".cn").textContent.trim().replace(/^[·\s]+/,"");
      const target=CLUSTERS.find(c=>c.n===name);
      if(target && target.id!==it.cid){
        const idx=ITEMS.filter(x=>x.cid===target.id).length;
        it.cid=target.id;
        const n=G.nodes.find(n=>n.it.id===it.id);
        if(n){ const a=idx*2.4; n.x=target.x+Math.cos(a)*34; n.y=target.y+Math.sin(a)*30; n.z=target.z; }
        buildGEdges(); toast(`已归入「${target.n}」· 不用再改`);
      } else toast("保持原位，没问题");
      closeAI(); render(); return;
    }
    if(d.kind==="write"){ toast("已采用这份写法"); closeAI(); return; }
    if(d.kind==="tag"){ toast("已贴上这套标签"); closeAI(); return; }
  }
  if(d.toast){ toast(d.toast); return; }
  if(d.hint){ const c=$("#ci"); if(c){ c.value=d.hint==="找一条"?"想找关于":""; c.focus(); } return; }
  if(d.comp==="close"){ $("#composer").classList.remove("on"); return; }
  if(d.comp==="save"){ saveNote(); return; }
  if(d.tri){ triageAct(d.tri, el); return; }

  switch(d.act){
    case "select": S.selectMode=true; S.picked.clear(); render(); break;
    case "exit-select": S.selectMode=false; S.picked.clear(); render(); break;
    case "to-coll":
      S.picked.forEach(id=>{if(!S.collection.includes(id))S.collection.push(id);});
      S.selectMode=false; S.picked.clear(); go("#/collection"); break;
    case "start-triage": openTriage(); break;
    case "toggle-read": S.reading=!S.reading; render(); break;
    case "shuffle": toast("换了一批，理由不变"); break;
    case "dismiss": toast("已记下：这几条不相关"); break;
    case "clear-q": S.q=""; render(); break;
    case "copy-coll":
      navigator.clipboard?.writeText(collText()).then(()=>toast("合辑已复制"))
        .catch(()=>toast("已生成，可手动选择复制"));
      break;
    case "export": toast("已导出 资料合辑.md"); break;
    case "reset": location.reload(); break;
  }
});
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]");
  if(c){ navigator.clipboard?.writeText(c.dataset.copy).then(()=>toast("已复制")).catch(()=>toast("已复制")); }
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey) && (e.key==="k"||e.key==="K")){
    e.preventDefault(); PAL.on?palClose():palOpen(); return;
  }
  const typing=/input|textarea/i.test(e.target.tagName);
  if(e.key==="Escape"){
    if(PAL.on) return palClose();
    if($("#ai").classList.contains("on")) return closeAI();
    if($("#composer").classList.contains("on")) return $("#composer").classList.remove("on");
    if($("#triage").classList.contains("on")) return closeTriage();
  }
  if(!e.isComposing && (e.ctrlKey||e.metaKey) && e.key==="Enter" && $("#composer").classList.contains("on") && e.target.id==="ct"){ e.preventDefault(); saveNote(); }
  if(!e.isComposing && e.key==="Enter" && S.route==="chat" && e.target.id==="ci"){ e.preventDefault(); chatSend(); }
  if($("#triage").classList.contains("on")){
    if(e.key==="Enter"){ e.preventDefault(); triageAct("accept",null); }
    if(e.key==="ArrowRight"){ e.preventDefault(); triageAct("reject",null); }
  }
  if(typing) return;
  if(e.key==="/"){ e.preventDefault(); go("#/search"); }
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); openComposer(); }
  if(e.key==="g"){ e.preventDefault(); go("#/library"); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){
    S.q=e.target.value;
    const wrap=$("#reswrap");
    if(wrap){ wrap.innerHTML=searchBody(); }
    else { render(); }
  }
});
function searchBody(){
  const q=S.q.trim();
  if(!q) return "";
  const hits=search(q), sugg=suggest(q);
  return `${sugg.length?`<div class="sugg"><div class="k">小拾想了三个说法</div>
    <div class="chips">${sugg.map(s=>`<button class="schip" data-q="${esc(s.text)}"><b>${s.lab}</b>${esc(s.text)}</button>`).join("")}</div></div>`:""}
  ${hits.length?`<div class="sub" style="margin:14px 0 6px">${hits.length} 条结果 · 按命中字段加权排序</div>
    <div class="res">${hits.map(h=>`
      <div class="rrow" data-open="${h.it.id}" role="button" tabindex="0">
        <div class="t">${hl(h.it.t,q)}</div>
        <div class="s">${hl(h.snip||h.it.one,q)}</div>
        <div class="m"><span class="src ${h.it.src}" style="width:16px;height:16px;font-size:9px">${ICON[h.it.src]}</span>
          ${esc(h.it.srcName)} · ${esc(clusterOf(h.it.id).n)}
          <span class="why">${h.fieldName}</span></div>
      </div>`).join("")}</div>`
  :`<div class="empty"><div class="big">没有找到「${esc(q)}」</div>
      <div class="h">试试更短的关键词，或使用 AI 找资料</div>
      <div class="acts"><button class="btn sm" data-act="clear-q">清空重搜</button>
        <button class="btn sm" data-act="start-triage">去整理 ${ITEMS.filter(i=>!i.triaged).length} 条</button></div></div>`}`;
}
function triageAct(kind,el){
  const id=S.queue[0], it=byId(id);
  if(kind==="close"){ closeTriage(); return; }
  if(kind==="all"){
    S.queue.forEach(q=>{ const x=byId(q); x.cid=clusterOf(q).id; x.triaged=true; });
    S.queue=[]; S.done=S.total; closeTriage(); render(); say(pick(LINES.triDone)); return;
  }
  if(!it) return;
  if(kind==="accept"){ it.triaged=true; }
  if(kind==="reject"){ it.cid="inb"; it.triaged=true; }
  if(kind==="skip"){ S.queue.push(S.queue.shift()); renderTriage(); return; }
  S.queue.shift(); S.done++;
  if(el && el.dataset.g){ it.cid=CLUSTERS.find(c=>c.n===el.dataset.g)?.id||it.cid; it.triaged=true; }
  renderTriage();
  if(!S.queue.length){ closeTriage(); render(); say(pick(LINES.triDone)); petReact("hop"); }
}

/* 路由 */
function parse(){
  const h=(location.hash||"#/inbox").replace(/^#\/?/,"")||"inbox";
  const wantDock = h.includes("?dock");
  const [raw,arg]=h.split("/");
  const name=raw.split("?")[0];
  S.route=name||"inbox";
  if(name==="detail"&&arg) S.id=+arg;
  if(name==="library"&&arg) S.libGroup=decodeURIComponent(arg);
  if(name==="library"&&!arg) S.libGroup=null;
  if(name==="search") S.q = arg ? decodeURIComponent(arg) : "";
  render();
  if(wantDock) setTimeout(()=>togglePetDock(true), 120);
}
window.addEventListener("hashchange",()=>{
  parse();
  if(S.route==="search"){
    S.searchCount[S.q]=(S.searchCount[S.q]||0)+1;
  }
});

</script>
<script src="/app.js"></script>
